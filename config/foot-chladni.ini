# Screensaver terminal for chladni-tui (foot).
# Smaller cell than the stock screensaver's 18 on purpose: the renderer draws in
# braille (2x4 sub-dots per cell), so a smaller cell buys resolution, not a
# smaller picture. Throughput cost rises roughly as 1/size^2.
[main]
font=Iosevka Nerd Font Mono:size=11
pad=0x0

[colors-dark]
background=151a1f
foreground=edf1f5

